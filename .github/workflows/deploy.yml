name: Deploy backend to cPanel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Folder in the cPanel home directory that is the Python app's "Application root".
      APP_DIR: ${{ secrets.APP_DIR || 'backyardapi' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }} exit

      - name: Write production .env
        run: |
          {
            echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}"
            echo "DJANGO_DEBUG=0"
            echo "DJANGO_ALLOWED_HOSTS=${{ secrets.API_DOMAIN }}"
            echo "CSRF_TRUSTED_ORIGINS=https://${{ secrets.API_DOMAIN }}"
            echo "CORS_ORIGINS=${{ secrets.SITE_ORIGINS }}"
            echo "SERVE_MEDIA=1"
            echo "TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}"
          } > .env

      # The server has no rsync, so the code is packed with tar, streamed over SSH and unpacked
      # over the app folder. Nothing on the server is deleted: the database, uploads, the virtualenv
      # and cPanel's own .htaccess are excluded and stay as they are.
      - name: Upload code
        run: |
          tar -czf "$RUNNER_TEMP/backend.tgz" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.sqlite3' \
            --exclude='*.sqlite3-journal' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='media' \
            --exclude='staticfiles' \
            --exclude='tmp' \
            --exclude='.htaccess' \
            --exclude='stderr.log' \
            --exclude='.DS_Store' \
            .
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }} \
            "mkdir -p ~/$APP_DIR && tar -xzf - -C ~/$APP_DIR" < "$RUNNER_TEMP/backend.tgz"

      # deploy.sh: checks the Python version, installs packages, migrates, collects static files, restarts.
      - name: Install, migrate and restart
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }} \
            "bash ~/$APP_DIR/deploy.sh"

      - name: Check the API answers
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.API_DOMAIN }}/api/site/")
          echo "GET https://${{ secrets.API_DOMAIN }}/api/site/ -> $code"
          test "$code" = "200"
